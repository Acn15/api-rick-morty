x-api-base: &api-base
  env_file:
    - .env
  environment:
    # Use DATABASE_URL do .env (banco externo / managed). Não sobe Postgres no Compose.
    # DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    REDIS_HOST: ${REDIS_HOST}
    REDIS_PORT: ${REDIS_PORT:-6379}
    EPISODES_CACHE_TTL_SECONDS: ${EPISODES_CACHE_TTL_SECONDS:-3600}
  networks:
    - app_net
  restart: unless-stopped

